name: Android release

# Tag a commit v1.2.3 and this builds a signed APK, verifies it, runs the web test
# suite as a gate, and attaches the APK to a GitHub Release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of release.keystore  (`base64 -w0 release.keystore`)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
#
# The keystore is the app's permanent identity. If it is lost, no future build can
# update an already-installed copy of the app, because Android rejects updates
# signed by a different key. Keep an offline backup somewhere you control.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Derived from the tag so versionCode always increases, which Android
      # requires for an update to be accepted. v1.2.3 -> 10203.
      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
            echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag '${tag}' is not vMAJOR.MINOR.PATCH, cannot derive a version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      # Required on a fresh checkout: capacitor-cordova-android-plugins/ is
      # gitignored but included by android/settings.gradle.
      - name: Sync Android project
        run: npx cap sync android

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.keystore
          # The gradle build resolves a bare relative path from android/, and warns
          # loudly if anything is missing, so confirm it landed before building.
          test -s android/keystore/release.keystore

      - name: Build release APK
        env:
          MAASATHI_KEYSTORE: keystore/release.keystore
          MAASATHI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAASATHI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAASATHI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAASATHI_VERSION_CODE: ${{ steps.version.outputs.code }}
          MAASATHI_VERSION_NAME: ${{ steps.version.outputs.name }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the signed APK
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::unsigned or missing APK: $apk"; exit 1; }
          # An incomplete signing config leaves the build succeeding but emits
          # app-release-unsigned.apk, which would ship an uninstallable file.
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk \
            || { echo "::error::build produced an unsigned APK"; exit 1; }

          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/apksigner" verify "$apk"
          # Android 15+ requires 16 KB aligned pages on 64-bit devices.
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^package|minSdkVersion|targetSdkVersion"

      - name: Run web test suite as a release gate
        run: |
          set -euo pipefail
          PW_BROWSER=playwright npx playwright install --with-deps chromium
          PW_BROWSER=playwright npm run test:e2e

      - name: Collect artifact
        id: collect
        if: always() && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        run: |
          set -euo pipefail
          name="MaaSathi-${{ steps.version.outputs.name }}-android.apk"
          mkdir -p dist-artifact
          cp android/app/build/outputs/apk/release/app-release.apk "dist-artifact/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: always() && steps.collect.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: maasathi-apk
          path: dist-artifact/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.collect.outputs.name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'MD'
          ## MaaSathi $TAG (Android)

          Install `*.apk` on a device with Android 7.0 (API 24) or newer.
          Android will ask you to allow installs from this source the first time.

          Requires JDK 21 and an Android SDK with platform 36 to build from source.
          See `docs/RELEASING.md`.
          MD
          gh release create "$TAG" \
            --title "MaaSathi $TAG (Android)" \
            --notes-file notes.md \
            "dist-artifact/$ASSET"
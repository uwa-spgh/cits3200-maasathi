name: Android release

# Two channels, both producing a signed, installable APK:
#
#   NIGHTLY  automatic, one per day, tagged nightly-YYYY-MM-DD, always a prerelease.
#            A rehearsal of the real thing: same applicationId, same signing key,
#            so a tester on a nightly can move onto a real release without losing
#            their data.
#
#   RELEASE  deliberate. Either push a v* tag, or trigger this workflow by hand
#            and give a tag. Also a prerelease by default, so nothing is ever
#            published as "Latest" until you untick the box.
#
# Both verify the APK is really signed and 16 KB aligned, and run the Playwright
# suite as a gate, before anything reaches a release page.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of release.keystore  (`base64 -w0 release.keystore`)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
#
# The keystore is the app's permanent identity. If it is lost, no future build can
# update an already-installed copy of the app, because Android rejects updates
# signed by a different key. Keep an offline backup somewhere you control.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.0.0 or v1.0.0-rc.1'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'Mark as a GitHub prerelease. Leave unticked for a real release.'
        required: false
        default: false
        type: boolean
  schedule:
    # 02:17 UTC daily. GitHub cron is UTC, and deliberately off the hour because
    # everyone schedules :00 and the queue is throttled.
    #
    # Scheduled workflows only run for workflow files on the default branch, and
    # GitHub disables them on public repositories after 60 days without activity.
    # If nightlies simply stop, check that before suspecting the build.
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      # All tags are needed: a nightly derives its version from the most recent
      # release tag, and counts the nightlies already built for that version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # versionCode must strictly increase or Android refuses the update. One
      # counter is shared by both channels, which is the whole difficulty, so the
      # scheme deliberately puts every tagged release above every nightly:
      #
      #   nightly-YYYY-MM-DD   -> YYYYMMDD                  e.g. 20261001
      #   vMAJOR.MINOR.PATCH-N -> 100000000 + M*10000+m*100+p-(100-N)
      #   vMAJOR.MINOR.PATCH   -> 100000000 + M*10000+m*100+p
      #
      # Consequences worth knowing:
      #  - a tester on a nightly can always move onto a real release, which is the
      #    direction that matters, because every release outranks every nightly;
      #  - but a tester who installs a real release can no longer install
      #    nightlies, because those sit lower. That is deliberate: they are on a
      #    release and should not be pulled back onto unstable builds. Use the
      #    debug build (a separate applicationId) if you want unstable alongside;
      #  - the prerelease subtraction makes rc.1 < rc.2 < final rather than
      #    putting release candidates above the final.
      # A nightly is a prerelease of the UPCOMING version, so it slots above the
      # last release and below its own final:
      #
      #   v1.0.0                      -> 1000100
      #   v1.0.1-nightly-2026-10-01   -> 1000101   installs over v1.0.0
      #   v1.0.1-nightly-2026-10-02   -> 1000102   installs over last night's
      #   v1.0.1-rc.1                 -> 1000151
      #   v1.0.1                      -> 1000200   installs over its own nightlies
      #   v1.0.2-nightly-...          -> 1000201
      #
      # versionCode = MAJOR*1000000 + MINOR*10000 + PATCH*100 + seq, where seq is
      # N for the Nth nightly of that patch, 50+N for rc.N, and 100 for the final.
      # Nightlies therefore take 1..49, leaving 50..99 for release candidates and
      # 100 for the real thing, which is why the final always wins over whatever
      # came before it in the same version slot.
      # A nightly is a prerelease of the UPCOMING version, so it sits above the
      # last release and below its own final:
      #
      #   v1.0.0                    -> 100009999
      #   v1.0.1-nightly-2026-10-01 -> 100010001   installs over v1.0.0
      #   v1.0.1-nightly-2026-10-02 -> 100010002   installs over last night
      #   v1.0.1-rc.1               -> 100019001
      #   v1.0.1                    -> 100019999   installs over its own nightlies
      #   v1.0.2-nightly-...        -> 100020001
      #
      # versionCode = MAJOR*1e8 + MINOR*1e6 + PATCH*1e4 + seq, with the patch slot
      # 10000 wide so the three kinds cannot crowd each other:
      #
      #   nightly  seq 1     .. 8999    (one per build, so a patch has years of room)
      #   rc.N     seq 9000+N.. 9998    (N up to 998)
      #   final    seq 9999             (always top of its own version)
      #
      # Keeping the final at the very top of the slot is what lets it replace its
      # own nightlies and rcs without anyone uninstalling. The rc offset is
      # subtracted from the top rather than added above it, so a release candidate
      # can never outrank the release it precedes.
      #
      # The ceiling is Android's 2100000000: the largest reachable value is
      # MAJOR=20 MINOR=99 PATCH=99 final = 2099999999, so MAJOR is capped at 20
      # and that is checked rather than assumed.
      - name: Derive version, tag and prerelease flag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          event="${{ github.event_name }}"

          # Most recent real release. rc and nightly tags are deliberately skipped.
          latest_release="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"

          if [[ "$event" == "schedule" ]]; then
            if [[ -z "$latest_release" ]]; then
              # Nothing released yet, so the version under development is 1.0.0
              # rather than a 0.0.x placeholder.
              next_major=1; next_minor=0; next_patch=0
            else
              IFS=. read -r lmaj lmin lpat <<< "${latest_release#v}"
              next_major="$lmaj"; next_minor="$lmin"; next_patch="$(( lpat + 1 ))"
            fi
            tag="v${next_major}.${next_minor}.${next_patch}-nightly-${today}"
          elif [[ "$event" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            version_name="${major}.${minor}.${patch}"
            seq=9999
            if [[ "$event" == "workflow_dispatch" ]]; then
              prerelease="$INPUT_PRERELEASE"
            else
              prerelease=false
            fi
          elif [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            n="${BASH_REMATCH[4]}"
            if (( n < 1 || n > 998 )); then
              echo "::error::rc number must be 1-998 so it stays below the final, got ${n}"
              exit 1
            fi
            version_name="${major}.${minor}.${patch}-rc.${n}"
            seq=$(( 9000 + n ))
            prerelease=true
          elif [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-nightly-([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            # The tag's own date, so a replayed or hand-pushed nightly reports the
            # version it is actually called rather than today's.
            version_name="${major}.${minor}.${patch}-nightly-${BASH_REMATCH[4]}"
            # Count what already exists for this version rather than deriving from
            # the date: a same-day rerun then reuses the tag and replaces the APK
            # instead of inventing a second number for one day.
            existing="$(git tag --list | grep -cE "^v${major}\\.${minor}\\.${patch}-nightly-" || true)"
            seq=$(( existing + 1 ))
            if (( seq > 8999 )); then
              echo "::error::v${major}.${minor}.${patch} already has ${existing} nightlies (max 8999); cut v${major}.${minor}.$((patch + 1))"
              exit 1
            fi
            prerelease=true
          else
            echo "::error::tag '${tag}' is not vM.m.p, vM.m.p-rc.N or vM.m.p-nightly-YYYY-MM-DD"
            exit 1
          fi

          # Guard the version fields rather than trusting them. MAJOR is capped at
          # 20 because that is where the arithmetic meets Android's ceiling.
          for pair in "major:$major:20" "minor:$minor:99" "patch:$patch:99"; do
            IFS=: read -r field value cap <<< "$pair"
            if (( 10#$value > cap )); then
              echo "::error::${field} is ${value}, above the supported maximum of ${cap}"
              exit 1
            fi
          done

          version_code="$(( 10#$major * 100000000 + 10#$minor * 1000000 + 10#$patch * 10000 + seq ))"

          if (( version_code > 2100000000 )); then
            echo "::error::versionCode ${version_code} exceeds Android's maximum of 2100000000"
            exit 1
          fi

          # Safety net: whatever we are building must outrank the latest release,
          # or nobody who installed it will be able to take this build.
          if [[ -n "$latest_release" ]]; then
            IFS=. read -r pmaj pmin ppat <<< "${latest_release#v}"
            previous_code=$(( 10#$pmaj * 100000000 + 10#$pmin * 1000000 + 10#$ppat * 10000 + 9999 ))
            if (( version_code <= previous_code )); then
              echo "::error::versionCode ${version_code} does not exceed ${latest_release}'s ${previous_code}; nobody could install this"
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "name=$version_name"
            echo "code=$version_code"
            echo "prerelease=$prerelease"
            echo "latest_release=$latest_release"
          } >> "$GITHUB_OUTPUT"

          echo "tag=$tag versionName=$version_name versionCode=$version_code seq=$seq prerelease=$prerelease latestRelease=${latest_release:-none}"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      # Required on a fresh checkout: capacitor-cordova-android-plugins/ is
      # gitignored but included by android/settings.gradle.
      - name: Sync Android project
        run: npx cap sync android

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.keystore
          # The gradle build resolves a bare relative path from android/, and warns
          # loudly if anything is missing, so confirm it landed before building.
          test -s android/keystore/release.keystore

      - name: Build release APK
        env:
          MAASATHI_KEYSTORE: keystore/release.keystore
          MAASATHI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAASATHI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAASATHI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAASATHI_VERSION_CODE: ${{ steps.version.outputs.code }}
          MAASATHI_VERSION_NAME: ${{ steps.version.outputs.name }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the signed APK
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::missing APK: $apk"; exit 1; }
          # An incomplete signing config leaves the build succeeding but emits
          # app-release-unsigned.apk, which would ship an uninstallable file.
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk \
            || { echo "::error::build produced an unsigned APK"; exit 1; }

          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/apksigner" verify "$apk"
          # Android 15+ requires 16 KB aligned pages on 64-bit devices.
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^package|minSdkVersion|targetSdkVersion"

      - name: Run web test suite as a gate
        run: |
          set -euo pipefail
          PW_BROWSER=playwright npx playwright install --with-deps chromium
          PW_BROWSER=playwright npm run test:e2e

      - name: Collect artifact
        id: collect
        if: always() && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        run: |
          set -euo pipefail
          name="MaaSathi-${{ steps.version.outputs.name }}-android.apk"
          mkdir -p dist-artifact
          cp android/app/build/outputs/apk/release/app-release.apk "dist-artifact/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: always() && steps.collect.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: maasathi-apk
          path: dist-artifact/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success() && steps.collect.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ASSET: ${{ steps.collect.outputs.name }}
        run: |
          set -euo pipefail

          flags=(--title "MaaSathi $VERSION (Android)")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun on the same day, or a re-push of the same tag. Replace the
            # asset rather than failing, and leave the existing prerelease state
            # alone so a nightly stays a nightly.
            gh release upload "$TAG" "dist-artifact/$ASSET" --clobber
            echo "Updated existing release $TAG"
          else
            if [[ "$TAG" == *-nightly-* ]]; then
              notes="Nightly build for $VERSION. Unstable, for testing only.

              This is a prerelease of the upcoming version, so it installs **over
              the last release** and keeps installing over each later nightly. When
              ${TAG%-nightly-*} is released properly it replaces this build, because
              the real thing always carries a higher version code."
            else
              notes="## MaaSathi $VERSION (Android)

              Install the \`*.apk\` on a device with Android 7.0 (API 24) or newer.
              Android will ask you to allow installs from this source the first time.

              If you were on a nightly of this version, this build installs over it
              directly — no need to uninstall, so your data is kept.

              Built with JDK 21 and an Android SDK with platform 36. See
              \`docs/RELEASING.md\` for how to build and sign it yourself."
            fi
            gh release create "$TAG" "${flags[@]}" --target "$GITHUB_SHA" \
              --notes "$notes" "dist-artifact/$ASSET"
            echo "Published $TAG${PRERELEASE:+ (prerelease)}"
          fi